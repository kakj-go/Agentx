syntax = "proto3";

package agentx.sandbox.v1;

service SandboxManager {
  rpc Create(CreateSandboxRequest) returns (SandboxLease);
  rpc Execute(ExecuteCommandRequest) returns (stream CommandEvent);
  rpc Interrupt(SandboxLeaseRequest) returns (OperationResult);
  rpc Upload(stream UploadChunk) returns (OperationResult);
  rpc Download(DownloadRequest) returns (stream FileChunk);
  rpc Metrics(SandboxLeaseRequest) returns (SandboxMetrics);
  rpc Terminate(SandboxLeaseRequest) returns (OperationResult);
}

message SandboxScope {
  string tenant_id = 1;
  string workflow_id = 2;
  optional string workflow_version_id = 3;
  string execution_id = 4;
  string node_execution_id = 5;
  string attempt_id = 6;
  string worker_lease_token = 7;
  string trace_id = 8;
  string request_id = 9;
  int64 deadline_unix_ms = 10;
}

message CreateSandboxRequest {
  SandboxScope scope = 1;
  string idempotency_key = 2;
  string profile_snapshot_json = 3;
  string labels_json = 4;
  string network_policy_json = 5;
  repeated SandboxCredentialHandle credentials = 6;
}

message SandboxCredentialHandle {
  string resource_id = 1;
  string handle = 2;
  string environment_name = 3;
}

message SandboxLease {
  string lease_id = 1;
  string sandbox_id = 2;
  string lease_token = 3;
  int64 expires_at_unix_ms = 4;
}

message ExecuteCommandRequest {
  SandboxScope scope = 1;
  SandboxLease lease = 2;
  repeated string argv = 3;
  string environment_json = 4;
  string working_directory = 5;
}

message CommandEvent {
  uint64 sequence = 1;
  oneof event {
    bytes stdout = 2;
    bytes stderr = 3;
    CommandCompleted completed = 4;
  }
}

message CommandCompleted {
  int32 exit_code = 1;
  bool partial = 2;
}

message SandboxLeaseRequest {
  SandboxScope scope = 1;
  SandboxLease lease = 2;
}

message UploadChunk {
  SandboxScope scope = 1;
  SandboxLease lease = 2;
  string path = 3;
  uint64 sequence = 4;
  bytes data = 5;
  bool eof = 6;
}

message DownloadRequest {
  SandboxScope scope = 1;
  SandboxLease lease = 2;
  string path = 3;
}

message FileChunk {
  uint64 sequence = 1;
  bytes data = 2;
  bool eof = 3;
}

message SandboxMetrics {
  uint64 cpu_nanos = 1;
  uint64 memory_bytes = 2;
  uint64 pids = 3;
  uint64 disk_bytes = 4;
  string raw_json = 5;
}

message OperationResult {
  bool accepted = 1;
  bool replayed = 2;
}
