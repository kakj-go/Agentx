syntax = "proto3";

package agentx.runtime.v1;

service RuntimeCoordinator {
  rpc RequestExecution(RequestExecutionRequest) returns (ExecutionAccepted);
  rpc CancelExecution(CancelExecutionRequest) returns (CommandAccepted);
  rpc ForkExecution(ForkExecutionRequest) returns (ExecutionAccepted);
  rpc ResumeExecution(ResumeExecutionRequest) returns (CommandAccepted);
  rpc ConfirmSideEffect(ConfirmSideEffectRequest) returns (CommandAccepted);
  rpc ReportNodeResult(ReportNodeResultRequest) returns (CommandAccepted);
  rpc HeartbeatLease(HeartbeatLeaseRequest) returns (HeartbeatLeaseResponse);
}

message RequestExecutionRequest {
  string tenant_id = 1;
  oneof source {
    VersionSource version = 2;
    DraftRevisionSource draft_revision = 10;
  }
  optional string invocation_id = 3;
  optional string session_id = 4;
  optional string requested_by = 5;
  string trigger_type = 6;
  string input_json = 7;
  optional string idempotency_key = 8;
  optional string caller_execution_id = 9;
  optional string parent_execution_id = 15;
  optional string trace_id = 16;
  optional string caller_node_execution_id = 17;
  string debug_plan_json = 11;
  string debug_overlay_json = 12;
  string resource_snapshots_json = 13;
  string context_json = 14;
}

message VersionSource {
  string version_id = 1;
}

message DraftRevisionSource {
  string workflow_id = 1;
  uint64 revision = 2;
}

message ExecutionAccepted {
  string execution_id = 1;
  string status = 2;
  bool replayed = 3;
}

message CancelExecutionRequest {
  string tenant_id = 1;
  string execution_id = 2;
  optional string actor_user_id = 3;
}

message ForkExecutionRequest {
  string tenant_id = 1;
  string source_execution_id = 2;
  string checkpoint_id = 3;
  string mode = 4;
  optional string node_id = 5;
  string input_overrides_json = 6;
  string side_effect_decisions_json = 7;
  string actor_user_id = 8;
  optional string idempotency_key = 9;
}

message ResumeExecutionRequest {
  string tenant_id = 1;
  string execution_id = 2;
  string node_execution_id = 3;
  string resume_token = 4;
  string output_port = 5;
  string payload_json = 6;
  string idempotency_key = 7;
  optional string actor_user_id = 8;
}

message ConfirmSideEffectRequest {
  string tenant_id = 1;
  string execution_id = 2;
  string node_execution_id = 3;
  optional string checkpoint_id = 4;
  string decision = 5;
  string actor_user_id = 6;
  string idempotency_key = 7;
}

message ReportNodeResultRequest {
  string tenant_id = 1;
  string execution_id = 2;
  string node_execution_id = 3;
  string attempt_id = 4;
  string lease_token = 5;
  string status = 6;
  string outputs_json = 7;
  optional string error_code = 8;
  optional string error_message = 9;
  bool retryable = 10;
  string suspend_json = 11;
}

message HeartbeatLeaseRequest {
  string tenant_id = 1;
  string attempt_id = 2;
  string lease_token = 3;
  string worker_instance_id = 4;
}

message HeartbeatLeaseResponse {
  bool valid = 1;
  bool cancellation_requested = 2;
}

message CommandAccepted {
  bool accepted = 1;
  bool replayed = 2;
}
