name: agentxctl-release

on:
  push:
    tags: ["agentxctl-v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: agentxctl-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            standalone: agentxctl-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            standalone: agentxctl-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.13"
      - run: uv run --frozen --group test python -m tools.scripts.release.verify_release --version "${{ github.ref_name }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.33.4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p agentxctl --target ${{ matrix.target }}
      - run: python tools/scripts/release/package_agentxctl.py --version "${{ github.ref_name }}" --target "${{ matrix.target }}"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: .local/dist/agentxctl-*-${{ matrix.target }}.${{ matrix.archive }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: .local/dist/${{ matrix.standalone }}
      - uses: actions/upload-artifact@v4
        with:
          name: agentxctl-${{ matrix.target }}
          path: |
            .local/dist/agentxctl-*.zip
            .local/dist/agentxctl-*.tar.gz
            .local/dist/agentxctl-*.sha256
            .local/dist/${{ matrix.standalone }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.13"
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - uses: actions/download-artifact@v4
        with:
          pattern: agentxctl-*
          merge-multiple: true
          path: .local/dist
      - run: chmod +x .local/dist/agentxctl-linux-x86_64
      - name: Verify all public Docker images before publishing the CLI
        run: uv run --frozen --group test python -m tools.scripts.release.verify_release --version "${{ github.ref_name }}" --binary .local/dist/agentxctl-linux-x86_64 --output .local/dist/release-images.json
      - name: Upload complete artifacts and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen --group test python -m tools.scripts.release.publish_release --tag "${{ github.ref_name }}" --notes "docs/releases/${{ github.ref_name }}.md"
