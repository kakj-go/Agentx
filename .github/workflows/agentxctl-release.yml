name: agentxctl-release

on:
  push:
    tags: ["agentxctl-v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            standalone: agentxctl-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            standalone: agentxctl-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.33.4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release -p agentxctl --target ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/scripts/release/package_agentxctl.py --version "${{ github.ref_name }}" --target "${{ matrix.target }}"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: .local/dist/agentxctl-*-${{ matrix.target }}.${{ matrix.archive }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: .local/dist/${{ matrix.standalone }}
      - uses: actions/upload-artifact@v4
        with:
          name: agentxctl-${{ matrix.target }}
          path: |
            .local/dist/agentxctl-*.zip
            .local/dist/agentxctl-*.tar.gz
            .local/dist/agentxctl-*.sha256
            .local/dist/${{ matrix.standalone }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: agentxctl-*
          merge-multiple: true
          path: .local/dist
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: .local/dist/*
