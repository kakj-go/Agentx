[workspace]
members = [
  "crates/agentx-api-types",
  "crates/agentx-application",
  "crates/agentx-domain",
  "crates/agentx-infrastructure",
  "crates/agentx-node-sdk",
  "crates/agentx-runtime",
  "crates/agentx-service-kit",
  "services/platform-api",
  "services/sandbox-manager",
  "services/trace-writer",
  "services/trigger-gateway",
  "services/workflow-coordinator",
  "services/workflow-worker",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
async-trait = "0.1"
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
clickhouse = "0.13"
config = "0.15"
futures = "0.3"
jsonwebtoken = "9.3"
object_store = { version = "0.11", features = ["aws"] }
rand = "0.8"
redis = { version = "0.29", features = ["tokio-comp", "connection-manager"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "mysql", "uuid", "time", "json", "migrate", "macros"] }
thiserror = "2.0"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.0", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["catch-panic", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5", features = ["uuid", "time"] }
utoipa-axum = "0.2"
uuid = { version = "1.0", features = ["serde", "v7"] }

agentx-api-types = { path = "crates/agentx-api-types" }
agentx-application = { path = "crates/agentx-application" }
agentx-domain = { path = "crates/agentx-domain" }
agentx-infrastructure = { path = "crates/agentx-infrastructure" }
agentx-node-sdk = { path = "crates/agentx-node-sdk" }
agentx-runtime = { path = "crates/agentx-runtime" }
agentx-service-kit = { path = "crates/agentx-service-kit" }
