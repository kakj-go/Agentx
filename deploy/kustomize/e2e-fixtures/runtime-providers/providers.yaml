apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: echo-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: echo-mcp
        app.kubernetes.io/part-of: agentx
        app.kubernetes.io/managed-by: agentxctl
        agentx.io/component: runtime-provider-fixture
    spec:
      automountServiceAccountToken: false
      containers:
        - name: echo-mcp
          image: agentx/echo-mcp:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: AGENTX_BIND_ADDR
              value: 0.0.0.0:8090
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: echo-mcp
spec:
  selector:
    app.kubernetes.io/name: echo-mcp
  ports:
    - name: http
      port: 8090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-node
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: echo-node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: echo-node
        app.kubernetes.io/part-of: agentx
        app.kubernetes.io/managed-by: agentxctl
        agentx.io/component: runtime-provider-fixture
    spec:
      automountServiceAccountToken: false
      containers:
        - name: echo-node
          image: agentx/echo-node:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: echo-node
spec:
  selector:
    app.kubernetes.io/name: echo-node
  ports:
    - name: http
      port: 8080
      targetPort: http
