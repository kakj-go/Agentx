apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentx-web
  labels:
    app.kubernetes.io/part-of: agentx
    app.kubernetes.io/managed-by: agentx-deploy
spec:
  ingressClassName: agentx-nginx
  rules:
    - host: agentx.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
