apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: observability, namespace: agentx-runtime }
spec: { minAvailable: 1, selector: { matchLabels: { app.kubernetes.io/name: observability } } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: observability-metrics-ingress, namespace: agentx-runtime }
spec:
  podSelector: { matchLabels: { agentx.io/metrics: enabled } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { agentx.io/metrics-access: "true" } }
      ports: [{ protocol: TCP, port: 9092 }]
