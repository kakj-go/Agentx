apiVersion: v1
kind: ServiceAccount
metadata: { name: observability, namespace: agentx-v2-runtime }
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata: { name: clickhouse, namespace: agentx-v2-runtime }
spec:
  selector: { app.kubernetes.io/name: clickhouse }
  ports: [{ name: http, port: 8123 }, { name: native, port: 9000 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: clickhouse, namespace: agentx-v2-runtime }
spec:
  serviceName: clickhouse
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: clickhouse } }
  template:
    metadata: { labels: { app.kubernetes.io/name: clickhouse, agentx.io/plane: observability } }
    spec:
      serviceAccountName: observability
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, fsGroup: 101, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:25.3
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          env:
            - { name: CLICKHOUSE_DB, value: agentx_observability }
            - { name: CLICKHOUSE_USER, value: observability_migrate }
            - name: CLICKHOUSE_PASSWORD
              valueFrom: { secretKeyRef: { name: agentx-observability-secrets, key: AGENTX_CLICKHOUSE_MIGRATE_PASSWORD } }
            - { name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT, value: "1" }
          ports: [{ name: http, containerPort: 8123 }, { name: native, containerPort: 9000 }]
          startupProbe:
            httpGet: { path: /ping, port: http }
            failureThreshold: 60
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/clickhouse }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
            - { name: clickhouse-secrets, mountPath: /run/secrets/agentx, readOnly: true }
      volumes:
        - name: init
          configMap: { name: clickhouse-init, defaultMode: 0555 }
        - name: clickhouse-secrets
          secret:
            secretName: agentx-observability-secrets
            items:
              - { key: AGENTX_CLICKHOUSE_QUERY_PASSWORD, path: query-password }
              - { key: AGENTX_CLICKHOUSE_CONSUMER_PASSWORD, path: consumer-password }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 2Gi } } }
---
apiVersion: batch/v1
kind: Job
metadata: { name: clickhouse-migrate, namespace: agentx-v2-runtime }
spec:
  backoffLimit: 2
  template:
    metadata: { labels: { app.kubernetes.io/name: clickhouse-migrate, agentx.io/plane: observability } }
    spec:
      serviceAccountName: observability
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-clickhouse
          image: curlimages/curl:8.12.1
          securityContext: { allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 101, runAsGroup: 102, capabilities: { drop: [ALL] } }
          command: [sh, -ec]
          args: ['until curl --fail --silent --user "observability_migrate:$AGENTX_CLICKHOUSE_PASSWORD" http://clickhouse:8123/ping >/dev/null; do sleep 2; done']
          env:
            - name: AGENTX_CLICKHOUSE_PASSWORD
              valueFrom: { secretKeyRef: { name: agentx-observability-secrets, key: AGENTX_CLICKHOUSE_MIGRATE_PASSWORD } }
      containers:
        - name: migrate
          image: agentx/agentx-migrate:dev
          imagePullPolicy: IfNotPresent
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: { drop: [ALL] } }
          args: [observability]
          env:
            - { name: AGENTX_CLICKHOUSE_URL, value: "http://clickhouse:8123" }
            - { name: AGENTX_CLICKHOUSE_DATABASE, value: agentx_observability }
            - { name: AGENTX_CLICKHOUSE_USER, value: observability_migrate }
            - { name: AGENTX_CLICKHOUSE_QUERY_USER, value: observability_query }
            - { name: AGENTX_CLICKHOUSE_CONSUMER_USER, value: observability_consumer }
            - name: AGENTX_CLICKHOUSE_PASSWORD
              valueFrom: { secretKeyRef: { name: agentx-observability-secrets, key: AGENTX_CLICKHOUSE_MIGRATE_PASSWORD } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: observability-default-deny, namespace: agentx-v2-runtime }
spec: { podSelector: {}, policyTypes: [Ingress, Egress] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: observability-data-access, namespace: agentx-v2-runtime }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: observability } }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: clickhouse } } }]
      ports: [{ protocol: TCP, port: 8123 }]
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: runtime-redis } } }]
      ports: [{ protocol: TCP, port: 6379 }]
    - to: [{ namespaceSelector: {}, podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: observability-migration-data-access, namespace: agentx-v2-runtime }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: clickhouse-migrate } }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: clickhouse } } }]
      ports: [{ protocol: TCP, port: 8123 }]
    - to: [{ namespaceSelector: {}, podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: observability-ops-data-access, namespace: agentx-v2-runtime }
spec:
  podSelector: { matchLabels: { agentx.io/ops-job: "true" } }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: clickhouse } } }]
      ports: [{ protocol: TCP, port: 8123 }]
    - to:
        - namespaceSelector: { matchLabels: { agentx.io/plane: dependencies } }
          podSelector: { matchLabels: { app.kubernetes.io/name: object-storage } }
      ports: [{ protocol: TCP, port: 9000 }]
    - to: [{ namespaceSelector: {}, podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: clickhouse-ingress, namespace: agentx-v2-runtime }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: clickhouse } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [observability, clickhouse-migrate] }
        - podSelector: { matchLabels: { agentx.io/ops-job: "true" } }
      ports: [{ protocol: TCP, port: 8123 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: observability-internal-api-ingress, namespace: agentx-v2-runtime }
spec:
  podSelector: { matchLabels: { agentx.io/internal-api: observability-v1 } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { agentx.io/plane: control } }
          podSelector: { matchLabels: { app.kubernetes.io/name: platform-control } }
      ports: [{ protocol: TCP, port: 8080 }]
