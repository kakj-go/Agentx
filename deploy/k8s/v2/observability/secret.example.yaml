apiVersion: v1
kind: Secret
metadata:
  name: agentx-observability-secrets
  namespace: agentx-runtime
  annotations:
    agentx.io/template-only: "true"
type: Opaque
stringData:
  AGENTX_CLICKHOUSE_QUERY_PASSWORD: generate-at-deploy-time
  AGENTX_CLICKHOUSE_CONSUMER_PASSWORD: generate-at-deploy-time
  AGENTX_CLICKHOUSE_MIGRATE_PASSWORD: generate-at-deploy-time
  AGENTX_OBSERVABILITY_REDIS_PASSWORD: mirrored-from-dependencies-secret
  AGENTX_OBSERVABILITY_BFF_JWT_PUBLIC_KEYS_JSON: mirrored-from-dependencies-secret
  AGENTX_OBSERVABILITY_S3_ACCESS_KEY: observability_object
  AGENTX_OBSERVABILITY_S3_SECRET_KEY: generate-at-deploy-time
