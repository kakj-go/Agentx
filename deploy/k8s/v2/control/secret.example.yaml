apiVersion: v1
kind: Secret
metadata:
  name: agentx-control-secrets
  namespace: agentx-v2-control
  annotations:
    agentx.io/template-only: "true"
type: Opaque
stringData:
  AGENTX_CONTROL_MYSQL_PASSWORD: generate-at-deploy-time
  AGENTX_CONTROL_MYSQL_MIGRATE_PASSWORD: generate-at-deploy-time
  AGENTX_CONTROL_MYSQL_ROOT_PASSWORD: generate-at-deploy-time
  AGENTX_CONTROL_S3_ACCESS_KEY: control_object
  AGENTX_CONTROL_S3_SECRET_KEY: generate-at-deploy-time
  AGENTX_CONTROL_PUBLISHER_JWT_KID: publisher-current
  AGENTX_CONTROL_PUBLISHER_JWT_PRIVATE_KEY_PEM: generate-rs256-at-deploy-time
  AGENTX_CONTROL_PROJECTOR_JWT_KID: projector-current
  AGENTX_CONTROL_PROJECTOR_JWT_PRIVATE_KEY_PEM: generate-independent-rs256-at-deploy-time
  AGENTX_CONTROL_BFF_JWT_KID: bff-current
  AGENTX_CONTROL_BFF_JWT_PRIVATE_KEY_PEM: generate-independent-rs256-at-deploy-time
  AGENTX_CONTROL_BUNDLE_KEY_ID: bundle-current
  AGENTX_CONTROL_BUNDLE_ED25519_PRIVATE_KEY_PEM: generate-ed25519-at-deploy-time
  AGENTX_CONTROL_WORK_PACKAGE_KEY_ID: work-package-current
  AGENTX_CONTROL_WORK_PACKAGE_ED25519_PRIVATE_KEY_PEM: generate-independent-ed25519-at-deploy-time
  AGENTX_CONTROL_API_REFRESH_JWT_SIGNING_SECRET: generate-at-least-32-random-bytes
  AGENTX_CONTROL_USER_JWT_KID: user-current
  AGENTX_CONTROL_USER_JWT_PRIVATE_KEY_PEM: generate-dedicated-rs256-private-key
  AGENTX_CONTROL_USER_JWT_PUBLIC_KEYS_JSON: generate-current-and-previous-user-rs256-public-keys
  AGENTX_CONTROL_VAULT_TOKEN: generate-control-webhook-write-only-vault-token
