apiVersion: v1
kind: Secret
metadata:
  name: agentx-control-secrets
  namespace: agentx-control
  annotations:
    agentx.io/template-only: "true"
type: Opaque
stringData:
  AGENTX_CONTROL_MYSQL_PASSWORD: generate-at-deploy-time
  AGENTX_CONTROL_MYSQL_MIGRATE_PASSWORD: generate-at-deploy-time
  AGENTX_CONTROL_MYSQL_ROOT_PASSWORD: generate-at-deploy-time
  AGENTX_CONTROL_S3_ACCESS_KEY: control_object
  AGENTX_CONTROL_S3_SECRET_KEY: generate-at-deploy-time
  AGENTX_CONTROL_PUBLISHER_JWT_KID: publisher-current
  AGENTX_CONTROL_PUBLISHER_JWT_PRIVATE_KEY_PEM: mirrored-from-dependencies-secret
  AGENTX_CONTROL_PROJECTOR_JWT_KID: projector-current
  AGENTX_CONTROL_PROJECTOR_JWT_PRIVATE_KEY_PEM: mirrored-from-dependencies-secret
  AGENTX_CONTROL_BFF_JWT_KID: bff-current
  AGENTX_CONTROL_BFF_JWT_PRIVATE_KEY_PEM: mirrored-from-dependencies-secret
  AGENTX_CONTROL_BUNDLE_KEY_ID: bundle-current
  AGENTX_CONTROL_BUNDLE_ED25519_PRIVATE_KEY_PEM: mirrored-from-dependencies-secret
  AGENTX_CONTROL_WORK_PACKAGE_KEY_ID: work-package-current
  AGENTX_CONTROL_WORK_PACKAGE_ED25519_PRIVATE_KEY_PEM: mirrored-from-dependencies-secret
  AGENTX_CONTROL_API_REFRESH_JWT_SIGNING_SECRET: generate-at-least-32-random-bytes
  AGENTX_CONTROL_USER_JWT_KID: user-current
  AGENTX_CONTROL_USER_JWT_PRIVATE_KEY_PEM: mirrored-from-dependencies-secret
  AGENTX_CONTROL_USER_JWT_PUBLIC_KEYS_JSON: mirrored-from-dependencies-secret
  # Cross-component values are mirrored by deploy-v2.ps1; do not edit them here.
  AGENTX_CONTROL_VAULT_TOKEN: mirrored-from-dependencies-secret
