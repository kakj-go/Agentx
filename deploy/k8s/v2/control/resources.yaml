apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-control
  namespace: agentx-v2-control
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: control-mysql
  namespace: agentx-v2-control
spec:
  selector:
    app.kubernetes.io/name: control-mysql
  ports: [{ name: mysql, port: 3306 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: control-mysql
  namespace: agentx-v2-control
spec:
  serviceName: control-mysql
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: control-mysql }
  template:
    metadata:
      labels: { app.kubernetes.io/name: control-mysql, agentx.io/plane: control }
    spec:
      serviceAccountName: platform-control
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: mysql
          image: mysql:8.4
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          env:
            - { name: MYSQL_DATABASE, value: agentx_control }
            - { name: MYSQL_ROOT_PASSWORD_FILE, value: /run/secrets/agentx/root-password }
          ports: [{ name: mysql, containerPort: 3306 }]
          startupProbe:
            exec: { command: [sh, -ec, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$(cat /run/secrets/agentx/root-password)"'] }
            failureThreshold: 60
            periodSeconds: 2
          readinessProbe:
            exec: { command: [sh, -ec, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$(cat /run/secrets/agentx/root-password)"'] }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
            - { name: mysql-secrets, mountPath: /run/secrets/agentx, readOnly: true }
      volumes:
        - name: init
          configMap: { name: control-mysql-init, defaultMode: 0555 }
        - name: mysql-secrets
          secret:
            secretName: agentx-control-secrets
            items:
              - { key: AGENTX_CONTROL_MYSQL_PASSWORD, path: app-password }
              - { key: AGENTX_CONTROL_MYSQL_MIGRATE_PASSWORD, path: migrate-password }
              - { key: AGENTX_CONTROL_MYSQL_ROOT_PASSWORD, path: root-password }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: control-migrate
  namespace: agentx-v2-control
spec:
  backoffLimit: 2
  template:
    metadata:
      labels: { app.kubernetes.io/name: control-migrate, agentx.io/plane: control }
    spec:
      serviceAccountName: platform-control
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-control-mysql
          image: mysql:8.4
          securityContext: { allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, capabilities: { drop: [ALL] } }
          command: [sh, -ec]
          args: ['until MYSQL_PWD="$AGENTX_CONTROL_MYSQL_PASSWORD" mysql -h control-mysql -u control_migrate -e "SELECT 1" agentx_control >/dev/null 2>&1; do sleep 2; done']
          env:
            - name: AGENTX_CONTROL_MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: agentx-control-secrets, key: AGENTX_CONTROL_MYSQL_MIGRATE_PASSWORD } }
      containers:
        - name: migrate
          image: agentx/agentx-migrate:dev
          imagePullPolicy: IfNotPresent
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: { drop: [ALL] } }
          args: [control]
          env:
            - { name: AGENTX_CONTROL_MYSQL_HOST, value: control-mysql }
            - { name: AGENTX_CONTROL_MYSQL_PORT, value: "3306" }
            - { name: AGENTX_CONTROL_MYSQL_DATABASE, value: agentx_control }
            - { name: AGENTX_CONTROL_MYSQL_USER, value: control_migrate }
            - { name: AGENTX_CONTROL_MYSQL_TLS_MODE, value: disabled }
            - name: AGENTX_CONTROL_MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: agentx-control-secrets, key: AGENTX_CONTROL_MYSQL_MIGRATE_PASSWORD } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-default-deny
  namespace: agentx-v2-control
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-mysql-access
  namespace: agentx-v2-control
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: control-mysql } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { agentx.io/plane: control } } }]
      ports: [{ protocol: TCP, port: 3306 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-egress
  namespace: agentx-v2-control
spec:
  podSelector: { matchLabels: { agentx.io/plane: control } }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: control-mysql } } }]
      ports: [{ protocol: TCP, port: 3306 }]
    - to:
        - namespaceSelector: { matchLabels: { agentx.io/plane: runtime } }
          podSelector: { matchLabels: { agentx.io/internal-api: runtime-v1 } }
      ports: [{ protocol: TCP, port: 8080 }]
    - to:
        - namespaceSelector: { matchLabels: { agentx.io/plane: runtime } }
          podSelector: { matchLabels: { agentx.io/internal-api: observability-v1 } }
      ports: [{ protocol: TCP, port: 8080 }]
    - to:
        - namespaceSelector: { matchLabels: { agentx.io/plane: dependencies } }
          podSelector: { matchLabels: { app.kubernetes.io/name: object-storage } }
      ports: [{ protocol: TCP, port: 9000 }]
    - to:
        - namespaceSelector: { matchLabels: { agentx.io/plane: dependencies } }
          podSelector: { matchLabels: { app.kubernetes.io/name: vault } }
      ports: [{ protocol: TCP, port: 8200 }]
    - to: [{ namespaceSelector: {}, podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: web-console-to-platform-control, namespace: agentx-v2-control }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: web-console } }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: platform-control } } }]
      ports: [{ protocol: TCP, port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: control-public-api-ingress, namespace: agentx-v2-control }
spec:
  podSelector: { matchLabels: { agentx.io/public-api: control } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: web-console } } }]
      ports: [{ protocol: TCP, port: 8080 }]
    - from:
        - namespaceSelector: { matchLabels: { agentx.io/ingress: allowed } }
          podSelector: { matchLabels: { agentx.io/ingress-client: allowed } }
      ports: [{ protocol: TCP, port: 8080 }]
