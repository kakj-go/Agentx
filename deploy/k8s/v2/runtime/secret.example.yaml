apiVersion: v1
kind: Secret
metadata:
  name: agentx-runtime-secrets
  namespace: agentx-v2-runtime
  annotations:
    agentx.io/template-only: "true"
type: Opaque
stringData:
  AGENTX_RUNTIME_MYSQL_PASSWORD: generate-at-deploy-time
  AGENTX_RUNTIME_MYSQL_MIGRATE_PASSWORD: generate-at-deploy-time
  AGENTX_RUNTIME_MYSQL_ROOT_PASSWORD: generate-at-deploy-time
  AGENTX_RUNTIME_REDIS_PASSWORD: generate-at-deploy-time
  AGENTX_RUNTIME_REDIS_ACL_FILE: generate-default-full-access-and-observability-restricted-users
  AGENTX_RUNTIME_S3_ACCESS_KEY: runtime_object
  AGENTX_RUNTIME_S3_SECRET_KEY: generate-at-deploy-time
  AGENTX_RUNTIME_SERVICE_JWT_PUBLIC_KEYS_JSON: generate-current-and-previous-rs256-public-keys
  AGENTX_RUNTIME_BUNDLE_PUBLIC_KEYS_JSON: generate-current-and-previous-ed25519-public-keys
  AGENTX_RUNTIME_WORK_PACKAGE_PUBLIC_KEYS_JSON: generate-independent-current-and-previous-ed25519-public-keys
  AGENTX_RUNTIME_USER_JWT_PUBLIC_KEYS_JSON: generate-current-and-previous-user-rs256-public-keys
  AGENTX_RUNTIME_VAULT_TOKEN: generate-runtime-webhook-read-only-vault-token
  AGENTX_OPENSANDBOX_API_KEY: generate-runtime-opensandbox-api-key
