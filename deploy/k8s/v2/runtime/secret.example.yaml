apiVersion: v1
kind: Secret
metadata:
  name: agentx-runtime-secrets
  namespace: agentx-runtime
  annotations:
    agentx.io/template-only: "true"
type: Opaque
stringData:
  AGENTX_RUNTIME_MYSQL_PASSWORD: generate-at-deploy-time
  AGENTX_RUNTIME_MYSQL_MIGRATE_PASSWORD: generate-at-deploy-time
  AGENTX_RUNTIME_MYSQL_ROOT_PASSWORD: generate-at-deploy-time
  AGENTX_RUNTIME_REDIS_PASSWORD: generate-at-deploy-time
  AGENTX_RUNTIME_REDIS_ACL_FILE: generate-default-full-access-and-observability-restricted-users
  AGENTX_RUNTIME_S3_ACCESS_KEY: runtime_object
  AGENTX_RUNTIME_S3_SECRET_KEY: generate-at-deploy-time
  AGENTX_RUNTIME_SERVICE_JWT_PUBLIC_KEYS_JSON: mirrored-from-dependencies-secret
  AGENTX_RUNTIME_BUNDLE_PUBLIC_KEYS_JSON: mirrored-from-dependencies-secret
  AGENTX_RUNTIME_WORK_PACKAGE_PUBLIC_KEYS_JSON: mirrored-from-dependencies-secret
  AGENTX_RUNTIME_USER_JWT_PUBLIC_KEYS_JSON: mirrored-from-dependencies-secret
  # Cross-component values are mirrored by deploy-v2.ps1; do not edit them here.
  AGENTX_RUNTIME_VAULT_TOKEN: mirrored-from-dependencies-secret
  AGENTX_RUNTIME_GATEWAY_EGRESS_JWT_PRIVATE_KEY_PEM: mirrored-from-dependencies-secret
  AGENTX_RUNTIME_GATEWAY_EGRESS_JWT_KEY_ID: mirrored-from-dependencies-secret
  AGENTX_WORKFLOW_RUNTIME_EGRESS_JWT_PRIVATE_KEY_PEM: mirrored-from-dependencies-secret
  AGENTX_WORKFLOW_RUNTIME_EGRESS_JWT_KEY_ID: mirrored-from-dependencies-secret
  AGENTX_WORKFLOW_WORKER_EGRESS_JWT_PRIVATE_KEY_PEM: mirrored-from-dependencies-secret
  AGENTX_WORKFLOW_WORKER_EGRESS_JWT_KEY_ID: mirrored-from-dependencies-secret
  AGENTX_SANDBOX_EGRESS_JWT_PRIVATE_KEY_PEM: mirrored-from-dependencies-secret
  AGENTX_SANDBOX_EGRESS_JWT_KEY_ID: mirrored-from-dependencies-secret
  AGENTX_OPENSANDBOX_API_KEY: generate-runtime-opensandbox-api-key
