apiVersion: v1
kind: ServiceAccount
metadata:
  name: workflow-runtime
  namespace: agentx-v2-runtime
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata: { name: runtime-mysql, namespace: agentx-v2-runtime }
spec:
  selector: { app.kubernetes.io/name: runtime-mysql }
  ports: [{ name: mysql, port: 3306 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: runtime-mysql, namespace: agentx-v2-runtime }
spec:
  serviceName: runtime-mysql
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: runtime-mysql } }
  template:
    metadata: { labels: { app.kubernetes.io/name: runtime-mysql, agentx.io/plane: runtime } }
    spec:
      serviceAccountName: workflow-runtime
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: mysql
          image: mysql:8.4
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          env:
            - { name: MYSQL_DATABASE, value: agentx_runtime }
            - { name: MYSQL_ROOT_PASSWORD_FILE, value: /run/secrets/agentx/root-password }
          ports: [{ name: mysql, containerPort: 3306 }]
          startupProbe:
            exec: { command: [sh, -ec, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$(cat /run/secrets/agentx/root-password)"'] }
            failureThreshold: 60
            periodSeconds: 2
          readinessProbe:
            exec: { command: [sh, -ec, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$(cat /run/secrets/agentx/root-password)"'] }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
            - { name: mysql-secrets, mountPath: /run/secrets/agentx, readOnly: true }
      volumes:
        - name: init
          configMap: { name: runtime-mysql-init, defaultMode: 0555 }
        - name: mysql-secrets
          secret:
            secretName: agentx-runtime-secrets
            items:
              - { key: AGENTX_RUNTIME_MYSQL_PASSWORD, path: app-password }
              - { key: AGENTX_RUNTIME_MYSQL_MIGRATE_PASSWORD, path: migrate-password }
              - { key: AGENTX_RUNTIME_MYSQL_ROOT_PASSWORD, path: root-password }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 2Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: runtime-redis, namespace: agentx-v2-runtime }
spec:
  selector: { app.kubernetes.io/name: runtime-redis }
  ports: [{ name: redis, port: 6379 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: runtime-redis, namespace: agentx-v2-runtime }
spec:
  serviceName: runtime-redis
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: runtime-redis } }
  template:
    metadata: { labels: { app.kubernetes.io/name: runtime-redis, agentx.io/plane: runtime } }
    spec:
      serviceAccountName: workflow-runtime
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: redis
          image: redis:7.4-alpine
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          args: [redis-server, --appendonly, "yes", --aclfile, /run/secrets/redis/users.acl]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: agentx-runtime-secrets, key: AGENTX_RUNTIME_REDIS_PASSWORD } }
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe:
            exec: { command: [sh, -ec, 'redis-cli -a "$REDIS_PASSWORD" ping'] }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: redis-acl, mountPath: /run/secrets/redis, readOnly: true }
      volumes:
        - name: redis-acl
          secret:
            secretName: agentx-runtime-secrets
            items:
              - { key: AGENTX_RUNTIME_REDIS_ACL_FILE, path: users.acl }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 1Gi } } }
---
apiVersion: batch/v1
kind: Job
metadata: { name: runtime-migrate, namespace: agentx-v2-runtime }
spec:
  backoffLimit: 2
  template:
    metadata: { labels: { app.kubernetes.io/name: runtime-migrate, agentx.io/plane: runtime, agentx.io/runtime-data: mysql } }
    spec:
      serviceAccountName: workflow-runtime
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-runtime-mysql
          image: mysql:8.4
          securityContext: { allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, capabilities: { drop: [ALL] } }
          command: [sh, -ec]
          args: ['until MYSQL_PWD="$AGENTX_RUNTIME_MYSQL_PASSWORD" mysql -h runtime-mysql -u runtime_migrate -e "SELECT 1" agentx_runtime >/dev/null 2>&1; do sleep 2; done']
          env:
            - name: AGENTX_RUNTIME_MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: agentx-runtime-secrets, key: AGENTX_RUNTIME_MYSQL_MIGRATE_PASSWORD } }
      containers:
        - name: migrate
          image: agentx/agentx-migrate:dev
          imagePullPolicy: IfNotPresent
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: { drop: [ALL] } }
          args: [runtime]
          env:
            - { name: AGENTX_RUNTIME_MYSQL_HOST, value: runtime-mysql }
            - { name: AGENTX_RUNTIME_MYSQL_PORT, value: "3306" }
            - { name: AGENTX_RUNTIME_MYSQL_DATABASE, value: agentx_runtime }
            - { name: AGENTX_RUNTIME_MYSQL_USER, value: runtime_migrate }
            - { name: AGENTX_RUNTIME_MYSQL_TLS_MODE, value: disabled }
            - name: AGENTX_RUNTIME_MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: agentx-runtime-secrets, key: AGENTX_RUNTIME_MYSQL_MIGRATE_PASSWORD } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: runtime-default-deny, namespace: agentx-v2-runtime }
spec: { podSelector: {}, policyTypes: [Ingress, Egress] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: runtime-data-access, namespace: agentx-v2-runtime }
spec:
  podSelector: { matchLabels: { agentx.io/runtime-data: mysql-redis } }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: runtime-mysql } } }]
      ports: [{ protocol: TCP, port: 3306 }]
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: runtime-redis } } }]
      ports: [{ protocol: TCP, port: 6379 }]
    - to:
        - namespaceSelector: { matchLabels: { agentx.io/plane: dependencies } }
          podSelector: { matchLabels: { app.kubernetes.io/name: object-storage } }
      ports: [{ protocol: TCP, port: 9000 }]
    - to: [{ namespaceSelector: {}, podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: runtime-migration-data-access, namespace: agentx-v2-runtime }
spec:
  podSelector: { matchLabels: { agentx.io/runtime-data: mysql } }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: runtime-mysql } } }]
      ports: [{ protocol: TCP, port: 3306 }]
    - to: [{ namespaceSelector: {}, podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: runtime-gateway-data-access, namespace: agentx-v2-runtime }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: runtime-gateway } }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: runtime-mysql } } }]
      ports: [{ protocol: TCP, port: 3306 }]
    - to:
        - namespaceSelector: { matchLabels: { agentx.io/plane: dependencies } }
          podSelector: { matchLabels: { app.kubernetes.io/name: object-storage } }
      ports: [{ protocol: TCP, port: 9000 }]
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: runtime-redis } } }]
      ports: [{ protocol: TCP, port: 6379 }]
    - to:
        - namespaceSelector: { matchLabels: { agentx.io/plane: dependencies } }
          podSelector: { matchLabels: { app.kubernetes.io/name: vault } }
      ports: [{ protocol: TCP, port: 8200 }]
    - to: [{ namespaceSelector: {}, podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: workflow-worker-vault-egress, namespace: agentx-v2-runtime }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: workflow-worker } }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { agentx.io/plane: dependencies } }
          podSelector: { matchLabels: { app.kubernetes.io/name: vault } }
      ports: [{ protocol: TCP, port: 8200 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: runtime-mysql-ingress, namespace: agentx-v2-runtime }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: runtime-mysql } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { agentx.io/plane: runtime } } }]
      ports: [{ protocol: TCP, port: 3306 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: runtime-redis-ingress, namespace: agentx-v2-runtime }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: runtime-redis } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { agentx.io/plane: runtime } } }]
      ports: [{ protocol: TCP, port: 6379 }]
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: observability } } }]
      ports: [{ protocol: TCP, port: 6379 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: runtime-internal-api-ingress, namespace: agentx-v2-runtime }
spec:
  podSelector: { matchLabels: { agentx.io/internal-api: runtime-v1 } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { agentx.io/plane: control } }
          podSelector: { matchLabels: { agentx.io/plane: control } }
      ports: [{ protocol: TCP, port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: runtime-provider-egress, namespace: agentx-v2-runtime }
spec:
  podSelector: { matchLabels: { agentx.io/plane: runtime } }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { agentx.io/plane: dependencies } }
          podSelector: { matchLabels: { agentx.io/runtime-provider: allowed } }
      ports: [{ protocol: TCP, port: 8081 }]
    - to:
        - namespaceSelector: { matchLabels: { agentx.io/plane: dependencies } }
          podSelector: { matchLabels: { agentx.io/runtime-provider: allowed } }
      ports: [{ protocol: TCP, port: 8080 }]
    - to:
        - namespaceSelector: { matchLabels: { agentx.io/plane: dependencies } }
          podSelector: { matchLabels: { agentx.io/runtime-provider: allowed } }
      ports:
        - { protocol: TCP, port: 8090 }
        - { protocol: TCP, port: 9621 }
        - { protocol: TCP, port: 8000 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: runtime-managed-egress-gateway, namespace: agentx-v2-runtime }
spec:
  podSelector: { matchLabels: { agentx.io/egress-client: managed } }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { agentx.io/plane: dependencies } }
          podSelector: { matchLabels: { app.kubernetes.io/name: agentx-egress-gateway } }
      ports: [{ protocol: TCP, port: 3128 }]
    - to:
        - namespaceSelector: {}
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: sandbox-manager-ingress, namespace: agentx-v2-runtime }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: sandbox-manager } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: workflow-worker } } }]
      ports: [{ protocol: TCP, port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: workflow-worker-sandbox-egress, namespace: agentx-v2-runtime }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: workflow-worker } }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: sandbox-manager } } }]
      ports: [{ protocol: TCP, port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: runtime-public-api-ingress, namespace: agentx-v2-runtime }
spec:
  podSelector: { matchLabels: { agentx.io/public-api: runtime } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { agentx.io/ingress: allowed } }
          podSelector: { matchLabels: { agentx.io/ingress-client: allowed } }
      ports: [{ protocol: TCP, port: 8080 }]
