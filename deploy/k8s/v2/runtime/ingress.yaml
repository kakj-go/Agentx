apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: runtime-gateway
  namespace: agentx-runtime
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "http://agentx.localhost"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization,Content-Type,Idempotency-Key,Last-Event-ID,X-Agentx-Timestamp,X-Agentx-Signature"
spec:
  ingressClassName: agentx-nginx
  tls: []
  rules:
    - host: run.agentx.localhost
      http:
        paths:
          - path: /gateway/v1
            pathType: Prefix
            backend:
              service: { name: runtime-gateway-public, port: { number: 8080 } }
