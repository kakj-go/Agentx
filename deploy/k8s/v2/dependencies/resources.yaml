apiVersion: v1
kind: ServiceAccount
metadata: { name: object-storage, namespace: agentx-v2-deps }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: vault, namespace: agentx-v2-deps }
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata: { name: vault, namespace: agentx-v2-deps }
spec:
  selector: { app.kubernetes.io/name: vault }
  ports: [{ name: http, port: 8200 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: agentx-v2-deps
spec:
  serviceName: vault
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: vault } }
  template:
    metadata: { labels: { app.kubernetes.io/name: vault, agentx.io/plane: dependencies } }
    spec:
      serviceAccountName: vault
      automountServiceAccountToken: false
      containers:
        - name: vault
          image: hashicorp/vault:1.19
          args: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
          env:
            - name: VAULT_DEV_ROOT_TOKEN_ID
              valueFrom: { secretKeyRef: { name: agentx-dependencies-secrets, key: VAULT_DEV_ROOT_TOKEN_ID } }
          ports: [{ name: http, containerPort: 8200 }]
          readinessProbe: { httpGet: { path: "/v1/sys/health?standbyok=true", port: http }, periodSeconds: 5 }
          volumeMounts: [{ name: data, mountPath: /vault/file }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 1Gi } } }
---
apiVersion: batch/v1
kind: Job
metadata: { name: vault-bootstrap, namespace: agentx-v2-deps }
spec:
  template:
    metadata: { labels: { app.kubernetes.io/name: vault-bootstrap, agentx.io/plane: dependencies } }
    spec:
      serviceAccountName: vault
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: hashicorp/vault:1.19
          env:
            - { name: VAULT_ADDR, value: http://vault:8200 }
            - name: VAULT_TOKEN
              valueFrom: { secretKeyRef: { name: agentx-dependencies-secrets, key: VAULT_DEV_ROOT_TOKEN_ID } }
            - name: CONTROL_VAULT_TOKEN
              valueFrom: { secretKeyRef: { name: agentx-dependencies-secrets, key: CONTROL_VAULT_TOKEN } }
            - name: RUNTIME_VAULT_TOKEN
              valueFrom: { secretKeyRef: { name: agentx-dependencies-secrets, key: RUNTIME_VAULT_TOKEN } }
          command: [/bin/sh, -ec]
          args:
            - |
              until vault status >/dev/null 2>&1; do sleep 2; done
              vault secrets enable -path=secret kv-v2 2>/dev/null || true
              printf 'path "secret/data/tenants/+/webhooks/+" { capabilities = ["create", "update"] }\n' | vault policy write agentx-control-webhook-writer -
              printf 'path "secret/data/tenants/+/runtime-credentials/+" { capabilities = ["create", "update"] }\n' | vault policy write agentx-control-runtime-credential-writer -
              printf 'path "secret/data/tenants/+/credentials/+" { capabilities = ["create", "update", "read"] }\npath "secret/destroy/tenants/+/credentials/+" { capabilities = ["update"] }\n' | vault policy write agentx-control-credential-manager -
              printf 'path "secret/data/tenants/+/webhooks/+" { capabilities = ["read"] }\npath "secret/data/tenants/+/runtime-credentials/+" { capabilities = ["read"] }\npath "secret/data/tenants/+/credentials/+" { capabilities = ["read"] }\n' | vault policy write agentx-runtime-secret-reader -
              vault token create -policy=agentx-control-webhook-writer -policy=agentx-control-runtime-credential-writer -policy=agentx-control-credential-manager -id="$CONTROL_VAULT_TOKEN" -orphan >/dev/null 2>&1 || true
              vault token create -policy=agentx-runtime-secret-reader -id="$RUNTIME_VAULT_TOKEN" -orphan >/dev/null 2>&1 || true
---
apiVersion: v1
kind: Service
metadata: { name: object-storage, namespace: agentx-v2-deps }
spec:
  selector: { app.kubernetes.io/name: object-storage }
  ports: [{ name: api, port: 9000 }, { name: console, port: 9001 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: object-storage, namespace: agentx-v2-deps }
spec:
  serviceName: object-storage
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: object-storage } }
  template:
    metadata: { labels: { app.kubernetes.io/name: object-storage, agentx.io/plane: dependencies } }
    spec:
      serviceAccountName: object-storage
      automountServiceAccountToken: false
      containers:
        - name: minio
          image: quay.io/minio/minio:latest
          args: [server, /data, --console-address, ":9001"]
          envFrom: [{ secretRef: { name: agentx-dependencies-secrets } }]
          ports: [{ name: api, containerPort: 9000 }, { name: console, containerPort: 9001 }]
          readinessProbe:
            httpGet: { path: /minio/health/live, port: api }
            periodSeconds: 5
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 2Gi } } }
---
apiVersion: batch/v1
kind: Job
metadata: { name: object-storage-bootstrap, namespace: agentx-v2-deps }
spec:
  template:
    metadata: { labels: { app.kubernetes.io/name: object-storage-bootstrap, agentx.io/plane: dependencies } }
    spec:
      serviceAccountName: object-storage
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: quay.io/minio/mc:latest
          envFrom: [{ secretRef: { name: agentx-dependencies-secrets } }]
          command: [/bin/sh, -ec]
          args:
            - |
              until mc alias set local http://object-storage:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do sleep 2; done
              mc mb --ignore-existing local/agentx-control
              mc mb --ignore-existing local/agentx-runtime
              mc mb --ignore-existing local/agentx-observability
              mc admin user add local control_object "$CONTROL_OBJECT_PASSWORD"
              mc admin user add local runtime_object "$RUNTIME_OBJECT_PASSWORD"
              mc admin user add local observability_object "$OBSERVABILITY_OBJECT_PASSWORD"
              printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:*"],"Resource":["arn:aws:s3:::agentx-control","arn:aws:s3:::agentx-control/*"]}]}' >/tmp/control.json
              printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:*"],"Resource":["arn:aws:s3:::agentx-runtime","arn:aws:s3:::agentx-runtime/*"]}]}' >/tmp/runtime.json
              printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:*"],"Resource":["arn:aws:s3:::agentx-observability","arn:aws:s3:::agentx-observability/*"]}]}' >/tmp/observability.json
              mc admin policy create local control-domain /tmp/control.json
              mc admin policy create local runtime-domain /tmp/runtime.json
              mc admin policy create local observability-domain /tmp/observability.json
              mc admin policy attach local control-domain --user control_object
              mc admin policy attach local runtime-domain --user runtime_object
              mc admin policy attach local observability-domain --user observability_object
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: dependencies-default-deny, namespace: agentx-v2-deps }
spec: { podSelector: {}, policyTypes: [Ingress, Egress] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: object-storage-ingress, namespace: agentx-v2-deps }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: object-storage } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchExpressions: [{ key: agentx.io/plane, operator: In, values: [control, runtime, dependencies] }] }
      ports: [{ protocol: TCP, port: 9000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: vault-ingress, namespace: agentx-v2-deps }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: vault } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchExpressions: [{ key: agentx.io/plane, operator: In, values: [control, runtime, dependencies] }] }
      ports: [{ protocol: TCP, port: 8200 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: dependencies-egress, namespace: agentx-v2-deps }
spec:
  podSelector:
    matchExpressions:
      - { key: agentx.io/plane, operator: In, values: [dependencies] }
      - { key: app.kubernetes.io/name, operator: NotIn, values: [agentx-egress-gateway] }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: object-storage } } }]
      ports: [{ protocol: TCP, port: 9000 }]
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: vault } } }]
      ports: [{ protocol: TCP, port: 8200 }]
    - to: [{ namespaceSelector: {}, podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: runtime-provider-ingress, namespace: agentx-v2-deps }
spec:
  podSelector: { matchLabels: { agentx.io/runtime-provider: allowed } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { agentx.io/runtime-provider: allowed } }
      ports:
        - { protocol: TCP, port: 8090 }
        - { protocol: TCP, port: 5432 }
    - from:
        - namespaceSelector: { matchLabels: { agentx.io/plane: runtime } }
          podSelector: { matchLabels: { agentx.io/plane: runtime } }
      ports: [{ protocol: TCP, port: 8081 }]
    - from:
        - namespaceSelector: { matchLabels: { agentx.io/plane: runtime } }
          podSelector: { matchLabels: { agentx.io/plane: runtime } }
      ports: [{ protocol: TCP, port: 8080 }]
    - from:
        - namespaceSelector: { matchLabels: { agentx.io/plane: runtime } }
          podSelector: { matchLabels: { agentx.io/plane: runtime } }
      ports:
        - { protocol: TCP, port: 8090 }
        - { protocol: TCP, port: 9621 }
        - { protocol: TCP, port: 8000 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: ingress-client-egress, namespace: agentx-v2-deps }
spec:
  podSelector: { matchLabels: { agentx.io/ingress-client: allowed } }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchExpressions: [{ key: agentx.io/plane, operator: In, values: [control, runtime] }] }
          podSelector: { matchExpressions: [{ key: agentx.io/public-api, operator: Exists }] }
      ports: [{ protocol: TCP, port: 8080 }]
    - to: [{ namespaceSelector: {}, podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: ingress-controller-ingress, namespace: agentx-v2-deps }
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ingress-nginx
      app.kubernetes.io/component: controller
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: 80 }
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 8443 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: ingress-controller-api-egress, namespace: agentx-v2-deps }
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [ingress-nginx] }
  policyTypes: [Egress]
  egress:
    - ports: [{ protocol: TCP, port: 443 }]
    - to: [{ namespaceSelector: {}, podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: runtime-provider-egress, namespace: agentx-v2-deps }
spec:
  podSelector: { matchLabels: { agentx.io/runtime-provider: allowed } }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { agentx.io/runtime-provider: allowed } } }]
      ports:
        - { protocol: TCP, port: 8090 }
        - { protocol: TCP, port: 5432 }
    - to: [{ namespaceSelector: {}, podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
