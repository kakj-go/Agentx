apiVersion: v1
kind: Secret
metadata:
  name: agentx-dependencies-secrets
  namespace: agentx-deps
  annotations:
    agentx.io/template-only: "true"
type: Opaque
stringData:
  MINIO_ROOT_USER: agentx_admin
  MINIO_ROOT_PASSWORD: generate-at-deploy-time
  CONTROL_OBJECT_PASSWORD: generate-at-deploy-time
  RUNTIME_OBJECT_PASSWORD: generate-at-deploy-time
  OBSERVABILITY_OBJECT_PASSWORD: generate-at-deploy-time
  VAULT_DEV_ROOT_TOKEN_ID: generate-local-vault-root-token
  # Canonical cross-component credentials. Domain/workload Secret values are mirrors.
  CONTROL_VAULT_TOKEN: generate-control-webhook-write-only-vault-token
  RUNTIME_VAULT_TOKEN: generate-runtime-webhook-read-only-vault-token
  OBSERVABILITY_REDIS_PASSWORD: generate-observability-redis-acl-password
  AGENTX_CONTROL_PUBLISHER_JWT_KID: publisher-current
  AGENTX_CONTROL_PROJECTOR_JWT_KID: projector-current
  AGENTX_CONTROL_BFF_JWT_KID: bff-current
  AGENTX_CONTROL_BUNDLE_KEY_ID: bundle-current
  AGENTX_CONTROL_WORK_PACKAGE_KEY_ID: work-package-current
  AGENTX_CONTROL_USER_JWT_KID: user-current
  AGENTX_CONTROL_PUBLISHER_JWT_PRIVATE_KEY_PEM: generate-rs256-at-deploy-time
  AGENTX_CONTROL_PROJECTOR_JWT_PRIVATE_KEY_PEM: generate-independent-rs256-at-deploy-time
  AGENTX_CONTROL_BFF_JWT_PRIVATE_KEY_PEM: generate-independent-rs256-at-deploy-time
  AGENTX_CONTROL_BUNDLE_ED25519_PRIVATE_KEY_PEM: generate-ed25519-at-deploy-time
  AGENTX_CONTROL_WORK_PACKAGE_ED25519_PRIVATE_KEY_PEM: generate-independent-ed25519-at-deploy-time
  AGENTX_CONTROL_USER_JWT_PRIVATE_KEY_PEM: generate-dedicated-rs256-private-key
  AGENTX_RUNTIME_SERVICE_JWT_PUBLIC_KEYS_JSON: generate-matching-service-public-keys
  AGENTX_OBSERVABILITY_BFF_JWT_PUBLIC_KEYS_JSON: generate-matching-bff-public-keys
  AGENTX_RUNTIME_BUNDLE_PUBLIC_KEYS_JSON: generate-matching-bundle-public-keys
  AGENTX_RUNTIME_WORK_PACKAGE_PUBLIC_KEYS_JSON: generate-matching-work-package-public-keys
  AGENTX_RUNTIME_USER_JWT_PUBLIC_KEYS_JSON: generate-matching-user-public-keys
  AGENTX_RUNTIME_GATEWAY_EGRESS_JWT_PRIVATE_KEY_PEM: generate-runtime-gateway-rs256-private-key
  AGENTX_RUNTIME_GATEWAY_EGRESS_JWT_KEY_ID: runtime-gateway-current
  AGENTX_WORKFLOW_RUNTIME_EGRESS_JWT_PRIVATE_KEY_PEM: generate-workflow-runtime-rs256-private-key
  AGENTX_WORKFLOW_RUNTIME_EGRESS_JWT_KEY_ID: workflow-runtime-current
  AGENTX_WORKFLOW_WORKER_EGRESS_JWT_PRIVATE_KEY_PEM: generate-workflow-worker-rs256-private-key
  AGENTX_WORKFLOW_WORKER_EGRESS_JWT_KEY_ID: workflow-worker-current
  AGENTX_SANDBOX_EGRESS_JWT_PRIVATE_KEY_PEM: generate-sandbox-rs256-private-key
  AGENTX_SANDBOX_EGRESS_JWT_KEY_ID: sandbox-current
  AGENTX_EGRESS_JWT_PUBLIC_KEYS_JSON: generate-matching-egress-public-keys
  AGENTX_EGRESS_TLS_CERTIFICATE_PEM: generate-egress-tls-certificate
  AGENTX_EGRESS_TLS_PRIVATE_KEY_PEM: generate-egress-tls-private-key
