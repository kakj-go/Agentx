apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agentx
resources:
  - ../../base
  - echo-mcp.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: agentx-config
    literals:
      - AGENTX_ENV=local
      - AGENTX_MYSQL_HOST=mysql
      - AGENTX_MYSQL_PORT=3306
      - AGENTX_MYSQL_DATABASE=agentx
      - AGENTX_MYSQL_USER=agentx
      - AGENTX_REDIS_URL=redis://redis:6379/
      - AGENTX_CLICKHOUSE_URL=http://clickhouse:8123
      - AGENTX_CLICKHOUSE_DATABASE=agentx
      - AGENTX_CLICKHOUSE_USER=agentx
      - AGENTX_S3_ENDPOINT=http://minio:9000
      - AGENTX_S3_BUCKET=agentx-artifacts
      - AGENTX_S3_REGION=us-east-1
      - AGENTX_S3_ALLOW_HTTP=true
      - AGENTX_COOKIE_SECURE=false
      - AGENTX_LOGIN_MAX_FAILURES=5
      - AGENTX_LOGIN_FAILURE_WINDOW_SECONDS=900
      - AGENTX_LOGIN_LOCK_SECONDS=900
      - AGENTX_CREDENTIAL_ACTIVE_KEY_ID=local-v1
      - AGENTX_CONNECTION_TEST_TIMEOUT_SECONDS=10
      - AGENTX_CONNECTION_TEST_MAX_CONCURRENCY=4
      - AGENTX_CONNECTION_ALLOW_PRIVATE_NETWORKS=false
      - AGENTX_CONNECTION_ALLOWED_HOSTS=echo-mcp,lightrag,mem0
      - AGENTX_CONNECTION_ALLOWED_CIDRS=
      - AGENTX_CUBESANDBOX_ENDPOINT=
secretGenerator:
  - name: agentx-secrets
    literals:
      - AGENTX_MYSQL_PASSWORD=agentx-local
      - AGENTX_MYSQL_ROOT_PASSWORD=agentx-root-local
      - AGENTX_CLICKHOUSE_PASSWORD=agentx-local
      - AGENTX_MINIO_USER=agentx
      - AGENTX_MINIO_PASSWORD=agentx-local-secret
      - AGENTX_JWT_SIGNING_SECRET=agentx-local-jwt-signing-secret-change-me
      - 'AGENTX_CREDENTIAL_KEYS_JSON={"keys":{"local-v1":"YWdlbnR4LWxvY2FsLWNyZWRlbnRpYWwta2V5LTAwMDE="}}'
images:
  - name: agentx/web
    newTag: dev
  - name: agentx/echo-mcp
    newTag: dev
  - name: agentx/platform-api
    newTag: dev
  - name: agentx/trigger-gateway
    newTag: dev
  - name: agentx/workflow-coordinator
    newTag: dev
  - name: agentx/workflow-worker
    newTag: dev
  - name: agentx/sandbox-manager
    newTag: dev
  - name: agentx/trace-writer
    newTag: dev
patches:
  - target:
      kind: Service
      name: web
    patch: |-
      - op: add
        path: /spec/type
        value: LoadBalancer
      - op: replace
        path: /spec/ports/0/port
        value: 8080
