apiVersion: batch/v1
kind: Job
metadata:
  name: platform-api-migrate
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-api-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: agentx/platform-api:dev
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: agentx-config
            - secretRef:
                name: agentx-secrets
