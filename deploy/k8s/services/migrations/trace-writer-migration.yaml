apiVersion: batch/v1
kind: Job
metadata:
  name: trace-writer-migrate
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trace-writer-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: agentx/trace-writer:dev
          imagePullPolicy: IfNotPresent
          args: ["migrate-clickhouse"]
          envFrom:
            - configMapRef:
                name: agentx-config
            - secretRef:
                name: agentx-secrets
