apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - platform-api-migration.yaml
  - trace-writer-migration.yaml
patches:
  - target:
      kind: Job
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: agentx-trust-bundle
            mountPath: /etc/agentx/trust
            readOnly: true
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: agentx-trust-bundle
            secret:
              secretName: agentx-trust-bundle
              optional: true
labels:
  - pairs:
      app.kubernetes.io/part-of: agentx
      app.kubernetes.io/managed-by: agentx-deploy
      agentx.io/component: migration
