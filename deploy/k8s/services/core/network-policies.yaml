apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentx-core-default-deny
spec:
  podSelector:
    matchLabels:
      agentx.io/component: core
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentx-core-internal
spec:
  podSelector:
    matchLabels:
      agentx.io/component: core
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentx-web-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentx-ingress
      ports:
        - protocol: TCP
          port: 8080
