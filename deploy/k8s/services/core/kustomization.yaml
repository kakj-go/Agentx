apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - web.yaml
  - platform-api.yaml
  - trigger-gateway.yaml
  - workflow-coordinator.yaml
  - workflow-worker.yaml
  - trace-writer.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: agentx
      app.kubernetes.io/managed-by: agentx-deploy
      agentx.io/component: core
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: agentx-trust-bundle
            mountPath: /etc/agentx/trust
            readOnly: true
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: agentx-trust-bundle
            secret:
              secretName: agentx-trust-bundle
              optional: true
