apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentx-sandbox-manager-default-deny
spec:
  podSelector:
    matchLabels:
      agentx.io/component: sandbox-manager
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentx-sandbox-manager-internal
spec:
  podSelector:
    matchLabels:
      agentx.io/component: sandbox-manager
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 9091
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
