apiVersion: apps/v1
kind: Deployment
metadata:
  name: trigger-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trigger-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trigger-gateway
    spec:
      containers:
        - name: trigger-gateway
          image: agentx/trigger-gateway:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: agentx-config
            - secretRef:
                name: agentx-secrets
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: trigger-gateway
spec:
  selector:
    app.kubernetes.io/name: trigger-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http

