apiVersion: v1
kind: Service
metadata:
  name: mem0-postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: mem0-postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mem0-postgres-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mem0-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mem0-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mem0-postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.0-pg17
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentx-mem0-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d/10-mem0.sql
              subPath: 10-mem0.sql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mem0-postgres-data
        - name: init
          configMap:
            name: agentx-mem0-postgres-init
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentx-mem0-postgres-init
data:
  10-mem0.sql: |
    CREATE DATABASE mem0_app;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mem0-history-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mem0
spec:
  selector:
    app.kubernetes.io/name: mem0
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mem0
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mem0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mem0
    spec:
      initContainers:
        - name: migrate
          image: agentx/mem0-server:v2.0.15
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: agentx-mem0-config
            - secretRef:
                name: agentx-mem0-secrets
      containers:
        - name: mem0
          image: agentx/mem0-server:v2.0.15
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
          envFrom:
            - configMapRef:
                name: agentx-mem0-config
            - secretRef:
                name: agentx-mem0-secrets
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /openapi.json
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: history
              mountPath: /app/history
      volumes:
        - name: history
          persistentVolumeClaim:
            claimName: mem0-history-data
