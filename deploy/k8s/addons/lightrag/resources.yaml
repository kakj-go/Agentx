apiVersion: v1
kind: Service
metadata:
  name: lightrag
spec:
  selector:
    app.kubernetes.io/name: lightrag
  ports:
    - name: http
      port: 9621
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lightrag-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightrag
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lightrag
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lightrag
    spec:
      containers:
        - name: lightrag
          image: ghcr.io/hkuds/lightrag@sha256:206579ab1a2bc1f2b5f19fe97c01cb801ff409e6ae29a15542f82208a285640a
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: agentx-lightrag-config
            - secretRef:
                name: agentx-lightrag-secrets
          ports:
            - name: http
              containerPort: 9621
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lightrag-data
