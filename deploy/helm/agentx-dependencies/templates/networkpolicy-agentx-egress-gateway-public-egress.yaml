apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: agentx-egress-gateway-public-egress, namespace: {{ .Values.global.namespaces.dependencies }} }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: agentx-egress-gateway } }
  policyTypes: [Egress]
  egress:
    - to: [{ namespaceSelector: {}, podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.168.0.0/16, 198.18.0.0/15, 224.0.0.0/4, 240.0.0.0/4]
      ports:
        {{- range .Values.global.network.egressGateway.allowedPublicPorts }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
