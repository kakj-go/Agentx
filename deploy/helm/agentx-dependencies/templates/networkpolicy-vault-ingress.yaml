{{- if ne .Values.global.environment "production" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: vault-ingress, namespace: {{ .Values.global.namespaces.dependencies }} }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: vault } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchExpressions: [{ key: agentx.io/plane, operator: In, values: [control, runtime, dependencies] }] }
      ports: [{ protocol: TCP, port: 8200 }]
{{- end }}
