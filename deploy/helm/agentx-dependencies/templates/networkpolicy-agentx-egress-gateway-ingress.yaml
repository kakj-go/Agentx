apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: agentx-egress-gateway-ingress, namespace: {{ .Values.global.namespaces.dependencies }} }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: agentx-egress-gateway } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: dependencies-doctor } } }]
      ports: [{ protocol: TCP, port: 8080 }]
    - from:
        - namespaceSelector: { matchLabels: { agentx.io/plane: runtime } }
          podSelector: { matchLabels: { agentx.io/egress-client: managed } }
      ports: [{ protocol: TCP, port: 3128 }]
    - from:
        {{- range .Values.global.network.egressGateway.sandboxAccess.sourceCidrs }}
        - ipBlock: { cidr: {{ . | quote }} }
        {{- end }}
      ports: [{ protocol: TCP, port: 3129 }]
