apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: ingress-controller-api-egress, namespace: {{ .Values.global.namespaces.dependencies }} }
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [ingress-nginx] }
  policyTypes: [Egress]
  egress:
    # NetworkPolicy implementations may evaluate traffic after the
    # kubernetes.default Service DNAT, where the API server listens on 6443.
    - ports: [{ protocol: TCP, port: 443 }, { protocol: TCP, port: 6443 }]
    - to: [{ namespaceSelector: {}, podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
