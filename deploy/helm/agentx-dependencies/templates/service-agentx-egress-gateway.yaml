apiVersion: v1
kind: Service
metadata: { name: agentx-egress-gateway, namespace: {{ .Values.global.namespaces.dependencies }} }
spec:
  selector: { app.kubernetes.io/name: agentx-egress-gateway }
  ports:
    - { name: health, port: 8080, targetPort: health }
    - { name: runtime-proxy, port: 3128, targetPort: runtime-proxy }
