{{- if eq .Values.global.components.runtimeRedis.mode "bundled" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: runtime-redis-ingress, namespace: {{ .Values.global.namespaces.runtime }} }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: runtime-redis } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { agentx.io/plane: runtime } } }]
      ports: [{ protocol: TCP, port: 6379 }]
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: observability } } }]
      ports: [{ protocol: TCP, port: 6379 }]
{{- end }}
