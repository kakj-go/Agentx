{{- with .Values.global.network.externalEgress.opensandbox }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: runtime-doctor-opensandbox-egress, namespace: {{ $.Values.global.namespaces.runtime }} }
spec:
  podSelector: { matchLabels: { agentx.io/opensandbox-health: allowed } }
  policyTypes: [Egress]
  egress:
    - to:
        {{- range .cidrs }}
        - ipBlock: { cidr: {{ . | quote }} }
        {{- end }}
      ports:
        {{- range .ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
{{- end }}
