apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: runtime-migration-data-access, namespace: {{ .Values.global.namespaces.runtime }} }
spec:
  podSelector: { matchLabels: { agentx.io/runtime-data: mysql } }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: runtime-mysql } } }]
      ports: [{ protocol: TCP, port: 3306 }]
    - to: [{ namespaceSelector: {}, podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
