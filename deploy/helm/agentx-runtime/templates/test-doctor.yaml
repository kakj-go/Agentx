apiVersion: batch/v1
kind: Job
metadata:
  name: runtime-doctor
  namespace: {{ .Values.global.namespaces.runtime }}
  annotations: { "helm.sh/hook": test, "helm.sh/hook-delete-policy": before-hook-creation }
  labels: { agentx.io/plane: runtime, app.kubernetes.io/name: runtime-doctor }
spec:
  backoffLimit: 0
  template:
    metadata: { labels: { agentx.io/plane: runtime, agentx.io/runtime-data: mysql-redis, agentx.io/ops-job: "true" } }
    spec:
      serviceAccountName: workflow-runtime
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: doctor
          image: {{ include "agentx.image" (list . "agentx-doctor") }}
          imagePullPolicy: {{ .Values.global.images.pullPolicy }}
          args: [runtime]
          env:
            - { name: AGENTX_RUNTIME_MYSQL_HOST, value: {{ .Values.global.components.runtimeMysql.host | quote }} }
            - { name: AGENTX_RUNTIME_MYSQL_PORT, value: {{ .Values.global.components.runtimeMysql.port | quote }} }
            - { name: AGENTX_RUNTIME_MYSQL_DATABASE, value: {{ .Values.global.components.runtimeMysql.database | quote }} }
            - { name: AGENTX_RUNTIME_MYSQL_USER, value: {{ .Values.global.components.runtimeMysql.appUser | quote }} }
            - { name: AGENTX_RUNTIME_MYSQL_MAX_CONNECTIONS, value: {{ .Values.global.components.runtimeMysql.maxConnections | quote }} }
            - { name: AGENTX_RUNTIME_MYSQL_TLS_MODE, value: {{ .Values.global.components.runtimeMysql.tlsMode | quote }} }
            - { name: AGENTX_RUNTIME_REDIS_URL, value: {{ .Values.global.components.runtimeRedis.url | quote }} }
            - { name: AGENTX_RUNTIME_S3_ENDPOINT, value: {{ .Values.global.components.objectStorage.endpoint | quote }} }
            - { name: AGENTX_RUNTIME_S3_BUCKET, value: {{ .Values.global.components.objectStorage.domains.runtime.bucket | quote }} }
            - { name: AGENTX_RUNTIME_S3_REGION, value: {{ .Values.global.components.objectStorage.region | quote }} }
            - { name: AGENTX_RUNTIME_S3_ALLOW_HTTP, value: {{ .Values.global.components.objectStorage.allowHttp | quote }} }
            - { name: AGENTX_RUNTIME_S3_PATH_STYLE, value: {{ .Values.global.components.objectStorage.pathStyle | quote }} }
            - name: AGENTX_RUNTIME_MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "agentx.secret" (list . "runtimeMigration" "runtime") }}, key: AGENTX_RUNTIME_MYSQL_PASSWORD } }
            - name: AGENTX_RUNTIME_REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "agentx.secret" (list . "runtimeMigration" "runtime") }}, key: AGENTX_RUNTIME_REDIS_PASSWORD } }
            - name: AGENTX_RUNTIME_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ include "agentx.secret" (list . "runtimeMigration" "runtime") }}, key: AGENTX_RUNTIME_S3_ACCESS_KEY } }
            - name: AGENTX_RUNTIME_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ include "agentx.secret" (list . "runtimeMigration" "runtime") }}, key: AGENTX_RUNTIME_S3_SECRET_KEY } }
{{ include "agentx.runtime.caEnv" . | nindent 12 }}
          resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { cpu: 250m, memory: 128Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: { drop: [ALL] } }
          volumeMounts:
{{ include "agentx.runtime.caMount" . | nindent 12 }}
        - name: opensandbox-health
          image: curlimages/curl:8.12.1
          args:
            - --fail
            - --silent
            - --connect-timeout
            - "10"
            - --max-time
            - "30"
{{- if .Values.global.components.sandbox.secureAccess }}
            - --cacert
            - /etc/agentx-opensandbox-ca/ca.crt
{{- end }}
            - --header
            - "Open-Sandbox-Api-Key: $(AGENTX_OPENSANDBOX_API_KEY)"
            - {{ printf "%s/health" (trimSuffix "/" .Values.global.components.sandbox.endpoint) | quote }}
          env:
            - name: AGENTX_OPENSANDBOX_API_KEY
              valueFrom: { secretKeyRef: { name: {{ include "agentx.secret" (list . "sandboxManager" "runtime") }}, key: AGENTX_OPENSANDBOX_API_KEY } }
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { cpu: 100m, memory: 64Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 101, runAsGroup: 102, capabilities: { drop: [ALL] } }
{{- if .Values.global.components.sandbox.secureAccess }}
          volumeMounts:
            - { name: opensandbox-ca, mountPath: /etc/agentx-opensandbox-ca, readOnly: true }
{{- end }}
      volumes:
{{ include "agentx.runtime.caVolume" . | nindent 8 }}
{{- if .Values.global.components.sandbox.secureAccess }}
        - name: opensandbox-ca
          secret: { secretName: {{ .Values.global.components.sandbox.caSecretName }}, items: [{ key: ca.crt, path: ca.crt }] }
{{- end }}
