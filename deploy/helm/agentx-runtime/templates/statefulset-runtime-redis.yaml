{{- if eq .Values.global.components.runtimeRedis.mode "bundled" }}
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: runtime-redis, namespace: {{ .Values.global.namespaces.runtime }} }
spec:
  serviceName: runtime-redis
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: runtime-redis } }
  template:
    metadata: { labels: { app.kubernetes.io/name: runtime-redis, agentx.io/plane: runtime } }
    spec:
      serviceAccountName: workflow-runtime
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: redis
          image: redis:7.4-alpine
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          args: [redis-server, --appendonly, "yes", --aclfile, /run/secrets/redis/users.acl]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.global.secrets.runtime }}, key: AGENTX_RUNTIME_REDIS_PASSWORD } }
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe:
            exec: { command: [sh, -ec, 'redis-cli -a "$REDIS_PASSWORD" ping'] }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: redis-acl, mountPath: /run/secrets/redis, readOnly: true }
      volumes:
        - name: redis-acl
          secret:
            secretName: agentx-runtime-secrets
            items:
              - { key: AGENTX_RUNTIME_REDIS_ACL_FILE, path: users.acl }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 1Gi } } }
{{- end }}
