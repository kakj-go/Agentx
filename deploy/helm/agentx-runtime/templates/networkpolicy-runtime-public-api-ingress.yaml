apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: runtime-public-api-ingress, namespace: {{ .Values.global.namespaces.runtime }} }
spec:
  podSelector: { matchLabels: { agentx.io/public-api: runtime } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { agentx.io/ingress: allowed } }
          podSelector: { matchLabels: { agentx.io/ingress-client: allowed } }
      ports: [{ protocol: TCP, port: 8080 }]
