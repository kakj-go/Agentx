apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: observability-metrics-ingress, namespace: {{ .Values.global.namespaces.runtime }} }
spec:
  podSelector: { matchLabels: { agentx.io/metrics: enabled } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { agentx.io/metrics-access: "true" } }
      ports: [{ protocol: TCP, port: 9092 }]
