apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: observability-migration-data-access, namespace: {{ .Values.global.namespaces.runtime }} }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: clickhouse-migrate } }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: clickhouse } } }]
      ports: [{ protocol: TCP, port: 8123 }]
    - to: [{ namespaceSelector: {}, podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
