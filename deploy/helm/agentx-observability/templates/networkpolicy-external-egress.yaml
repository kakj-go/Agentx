{{- if eq .Values.global.environment "production" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: observability-external-egress, namespace: {{ .Values.global.namespaces.runtime }} }
spec:
  podSelector: { matchExpressions: [{ key: agentx.io/plane, operator: In, values: [observability] }] }
  policyTypes: [Egress]
  egress:
    {{- range $name := list "runtimeRedis" "clickhouse" "objectStorage" }}
    {{- with index $.Values.global.network.externalEgress $name }}
    - to:
        {{- range .cidrs }}
        - ipBlock: { cidr: {{ . | quote }} }
        {{- end }}
      ports:
        {{- range .ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
