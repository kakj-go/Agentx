[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentx-tools"
version = "0.1.0"
description = "Cross-platform deployment and validation tools for Agentx"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography>=44.0,<46",
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-timeout>=2.3,<3",
  "ruff>=0.11,<1",
]

[project.scripts]
agentx-deploy = "agentx_deploy.cli:main"
agentx-check = "agentx_tools.check:main"

[tool.setuptools.packages.find]
where = ["deploy/python", "tools/python"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["deploy/tests", "tests/e2e"]
markers = [
  "infrastructure: Kubernetes infrastructure and data-domain scenarios",
  "publishing: bundle publishing and activation scenarios",
  "gateway: invocation, webhook, and SSE scenarios",
  "runtime: workflow runtime, worker, recovery, and sandbox scenarios",
  "observability: trace ingestion and query scenarios",
  "security: isolation, secret, and network-policy scenarios",
  "upgrade: migration, backup, upgrade, and rollback scenarios",
  "product: full product and Playwright scenarios",
  "cluster: requires an accessible Kubernetes cluster",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]
ignore = ["E501", "S603", "S607", "SIM115"]

[tool.ruff.lint.per-file-ignores]
"deploy/tests/**" = ["S101"]
"tests/**" = ["S101"]
